<DOYTYPE.html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Anfal Library - Login</title>
</head>
<body>

    <header>
        <h1>Al-Anfal Library</h1>
        <p>Your World of Reading and Knowledge</p>

        <nav>
            <a href="login.html">Login</a> |
            <a href="index.html">Home</a> |
            <a href="books.html">Books</a> |
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Welcome to Al-Anfal Library</h2>
        <p>Please choose your login option.</p>

        <section>
            <h3>User Login</h3>

            <form action="#" method="post">
                <label for="user-email">Email Address:</label><br>
                <input type="email" id="user-email"
                       name="user_email" required>
                <br><br>

                <label for="user-password">Password:</label><br>
                <input type="password" id="user-password"
                       name="user_password" required>
                <br><br>

                <button type="submit">Login</button>
            </form>
        </section>

        <hr>

        <section>
            <h3>Create a New Account</h3>

            <form action="#" method="post">
                <label for="new-name">Full Name:</label><br>
                <input type="text" id="new-name"
                       name="full_name" required>
                <br><br>

                <label for="new-email">Email Address:</label><br>
                <input type="email" id="new-email"
                       name="new_email" required>
                <br><br>

                <label for="new-password">Create Password:</label><br>
                <input type="password" id="new-password"
                       name="new_password" required>
                <br><br>

                <button type="submit">Create Account</button>
            </form>
        </section>

        <hr>

        <section>
            <h3>Administration</h3>

            <form action="#" method="post">
                <label for="admin-email">Admin Email:</label><br>
                <input type="email" id="admin-email"
                       name="admin_email" required>
                <br><br>

                <label for="admin-password">Admin Password:</label><br>
                <input type="password" id="admin-password"
                       name="admin_password" required>
                <br><br>

                <button type="submit">Admin Login</button>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Al-Anfal Library. All Rights Reserved.</p>
    </footer>

</body>
</html>
