<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al-Anfal Library - Create Account</title>

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="create-account.css">
</head>

<body>

    <header class="page-header">
        <h1>Al-Anfal Library</h1>
        <p>Your World of Reading and Knowledge</p>
    </header>

    <main class="account-container">

        <section class="account-card">

            <h2>Create Your Account</h2>

            <p class="welcome-text">
                Join Al-Anfal Library and discover a world of knowledge.
            </p>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <div class="form-group">
                    <label for="account-type">Account Type</label>

                    <select id="account-type" name="account-type" required>
                        <option value="">Select account type</option>
                        <option value="reader">Reader</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <div class="terms">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required>

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <button type="submit" class="submit-button">
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="index.html">Login here</a>
            </p>

            <p class="home-link">
                <a href="home.html">Back to Home</a>
            </p>

        </section>

    </main>

    <footer class="page-footer">
        <p>&copy; 2026 Al-Anfal Library. All Rights Reserved.</p>
    </footer>

</body>

</html>
