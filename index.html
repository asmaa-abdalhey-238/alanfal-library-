<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Anfal Library - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
        <h1>Al-Anfal Library</h1>
        <p>Your World of Reading and Knowledge</p>
    </header>

    <hr>

    <main>
        <section>
            <h2>Welcome to Al-Anfal Library</h2>
            <p>Please login to access the library.</p>

            <h3>Login to Your Account</h3>

            <form action="home.html" method="get">
                <label for="login-email">Email Address:</label><br>
                <input type="email" id="login-email"
                       name="email" required>
                <br><br>

                <label for="login-password">Password:</label><br>
                <input type="password" id="login-password"
                       name="password" required>
                <br><br>

                <button type="submit">Login</button>
            </form>
        </section>

        <hr>

        <section>
            <h3>Create a New Account</h3>
            <p>New to Al-Anfal Library? Create your account here.</p>

            <form action="#" method="post">
                <label for="full-name">Full Name:</label><br>
                <input type="text" id="full-name"
                       name="full_name" required>
                <br><br>

                <label for="signup-email">Email Address:</label><br>
                <input type="email" id="signup-email"
                       name="email" required>
                <br><br>

                <label for="signup-password">Create Password:</label><br>
                <input type="password" id="signup-password"
                       name="password" required>
                <br><br>

                <label for="confirm-password">Confirm Password:</label><br>
                <input type="password" id="confirm-password"
                       name="confirm_password" required>
                <br><br>

                <button type="submit">Create Account</button>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Al-Anfal Library. All Rights Reserved.</p>
    </footer>

</body>
</html>
