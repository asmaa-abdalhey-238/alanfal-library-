<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al-Anfal Library - Create Account</title>

    <link rel="stylesheet" href="account.css">
</head>

<body>

    <header>
        <h1>Al-Anfal Library</h1>
        <p>Your World of Reading and Knowledge</p>
    </header>

    <hr>

    <main>
        <section>
            <h2>Create a New Account</h2>

            <p>
                Join Al-Anfal Library and enjoy your
                world of reading and knowledge.
            </p>

            <form action="#" method="post">

                <label for="full-name">Full Name:</label><br>
                <input
                    type="text"
                    id="full-name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >
                <br><br>

                <label for="signup-email">Email Address:</label><br>
                <input
                    type="email"
                    id="signup-email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
                <br><br>

                <label for="signup-password">Create Password:</label><br>
                <input
                    type="password"
                    id="signup-password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
                <br><br>

                <label for="confirm-password">Confirm Password:</label><br>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >
                <br><br>

                <button type="submit">Create Account</button>

            </form>

            <p>
                Already have an account?
                <a href="index.html">Login here</a>
            </p>

            <p>
                <a href="home.html">Back to Home</a>
            </p>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Al-Anfal Library. All Rights Reserved.</p>
    </footer>

</body>
</html>
